# GTM-agents CI. Runs the same checks as `npm run check`, plus a gitleaks scan of the pushed
# commits and a license check of production dependencies. Third-party actions are pinned to
# commit SHAs. Reviewed gitleaks false positives are listed by fingerprint in .gitleaksignore, and
# .gitleaks.toml keeps the default rules with one exception for brain lock files.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, evals, hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run eval
      - run: npm run check:placeholders
      - run: npm run check:secrets
      - run: npm run check:migrations
      - run: npm run check:brain

  worker:
    name: Admin build and worker bundle (placeholders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @gtm-agents/admin
      - name: wrangler deploy --dry-run (production and staging)
        working-directory: apps/worker
        run: |
          npx wrangler deploy --dry-run --outdir dist
          npx wrangler deploy --dry-run --env staging --outdir dist-staging

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repositories owned by a GitHub organization need a free key from gitleaks.io,
          # stored as the GITLEAKS_LICENSE secret. Personal repositories do not.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  licenses:
    name: Production dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Workspace-aware: lists every workspace's production dependencies with `npm query`.
      - run: npm run check:licenses

  release-smoke:
    # Proves a release would work without publishing anything (docs/RELEASING.md): builds and packs
    # every package, installs the tarballs in a temporary directory, runs gtm --help and gtm init in
    # npm mode, installs the generated project against the tarballs, then runs wrangler deploy
    # --dry-run, tsc, gtm brain validate and gtm doctor in it (and the same for gtm init --local).
    name: Release packaging smoke test (publishes nothing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The smoke test runs third-party install scripts in temporary projects.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # As in the release workflow, the tarballs are built with no dependency install scripts.
      - run: npm ci --ignore-scripts
      - run: node scripts/release/version.mjs --check
      - run: node scripts/release/pack.mjs
      - run: node scripts/release/smoke.mjs
      - run: node scripts/release/publish.mjs --dry-run
